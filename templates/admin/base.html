<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin{% endblock %} — Open Learn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body class="role-admin">

<div class="app">
    <div class="sidebar-scrim" data-sidebar-scrim></div>

    <aside class="sidebar">
        <a href="/admin/dashboard" class="sidebar-brand">
            <span class="brand-mark"><i class="fa-solid fa-graduation-cap"></i></span>
            <span class="brand-text">
                <span class="brand-name">Open<span>Learn</span></span>
                <span class="brand-role">Administrator</span>
            </span>
        </a>

        <nav class="sidebar-nav">
            <p class="nav-label">Overview</p>
            <a href="/admin/dashboard" class="nav-link {{ 'active' if request.endpoint == 'admin_dashboard' }}">
                <i class="fa-solid fa-gauge-high"></i> Dashboard
            </a>

            <p class="nav-label">Teachers</p>
            <a href="/admin/teachers" class="nav-link {{ 'active' if request.endpoint == 'admin_teachers' }}">
                <i class="fa-solid fa-chalkboard-user"></i> All teachers
            </a>
            <a href="/admin/add-teacher" class="nav-link {{ 'active' if request.endpoint == 'admin_add_teacher' }}">
                <i class="fa-solid fa-user-plus"></i> Add teacher
            </a>
            <a href="/admin/assign" class="nav-link {{ 'active' if request.endpoint == 'admin_assign' }}">
                <i class="fa-solid fa-link"></i> Assign branch
            </a>
            <a href="/admin/unassign" class="nav-link {{ 'active' if request.endpoint == 'admin_unassign' }}">
                <i class="fa-solid fa-link-slash"></i> Unassign branch
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="user-card">
                <span class="avatar">AD</span>
                <div>
                    <span class="user-name">Administrator</span>
                    <span class="user-meta">Full campus access</span>
                </div>
            </div>
            <a href="/logout" class="logout-link"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sign out</a>
        </div>
    </aside>

    <div class="app-body">
        <header class="topbar">
            <button class="menu-btn" type="button" aria-label="Open menu" data-sidebar-toggle>
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="topbar-path">
                <span>Admin</span>
                <i class="fa-solid fa-chevron-right"></i>
                <strong>{% block page_name %}Dashboard{% endblock %}</strong>
            </div>

            <div class="topbar-right">
                <span class="topbar-pill"><i class="fa-solid fa-user-shield"></i> Administrator</span>
                <a href="/logout" class="icon-btn" title="Sign out"><i class="fa-solid fa-arrow-right-from-bracket"></i></a>
            </div>
        </header>

        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>

<script src="{{ url_for('static', filename='js/ui.js') }}"></script>
</body>
</html>
