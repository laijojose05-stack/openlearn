<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Parent{% endblock %} — Open Learn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body class="role-parent">

<div class="app">
    <div class="sidebar-scrim" data-sidebar-scrim></div>

    <aside class="sidebar">
        <a href="{{ url_for('parent_dashboard') }}" class="sidebar-brand">
            <span class="brand-mark"><i class="fa-solid fa-graduation-cap"></i></span>
            <span class="brand-text">
                <span class="brand-name">Open<span>Learn</span></span>
                <span class="brand-role">Parent</span>
            </span>
        </a>

        <nav class="sidebar-nav">
            <p class="nav-label">My child</p>
            <a href="{{ url_for('parent_dashboard') }}" class="nav-link {{ 'active' if request.endpoint == 'parent_dashboard' }}">
                <i class="fa-solid fa-house"></i> Overview
            </a>
            <a href="{{ url_for('parent_attendance') }}" class="nav-link {{ 'active' if request.endpoint == 'parent_attendance' }}">
                <i class="fa-solid fa-chart-simple"></i> Attendance
            </a>
            <a href="{{ url_for('parent_updates') }}" class="nav-link {{ 'active' if request.endpoint == 'parent_updates' }}">
                <i class="fa-solid fa-bullhorn"></i> Updates
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="user-card">
                <span class="avatar">PR</span>
                <div>
                    <span class="user-name">Parent account</span>
                    <span class="user-meta">Guardian access</span>
                </div>
            </div>
            <a href="{{ url_for('logout') }}" class="logout-link"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sign out</a>
        </div>
    </aside>

    <div class="app-body">
        <header class="topbar">
            <button class="menu-btn" type="button" aria-label="Open menu" data-sidebar-toggle>
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="topbar-path">
                <span>Parent</span>
                <i class="fa-solid fa-chevron-right"></i>
                <strong>{% block page_name %}Overview{% endblock %}</strong>
            </div>

            <div class="topbar-right">
                <span class="topbar-pill"><i class="fa-solid fa-people-roof"></i> Guardian</span>
                <a href="{{ url_for('logout') }}" class="icon-btn" title="Sign out"><i class="fa-solid fa-arrow-right-from-bracket"></i></a>
            </div>
        </header>

        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>

<script src="{{ url_for('static', filename='js/ui.js') }}"></script>
</body>
</html>
